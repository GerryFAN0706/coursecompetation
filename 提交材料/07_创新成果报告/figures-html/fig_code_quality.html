<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    display: flex; justify-content: center;
    padding: 24px;
    color: #1e293b;
  }
  .container { width: 960px; }
  .fig-title {
    text-align: center; font-size: 17px; font-weight: 800;
    color: #1e293b; margin-bottom: 2px; letter-spacing: 0.5px;
  }
  .fig-subtitle {
    text-align: center; font-size: 12.5px; color: #94a3b8; margin-bottom: 12px;
  }

  .legend {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 14px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: #475569; font-weight: 600;
  }
  .legend-swatch { width: 24px; height: 10px; border-radius: 3px; }
  .ls-control { background: #cbd5e1; }
  .ls-experiment { background: #1e293b; }

  .bars-container { display: flex; flex-direction: column; gap: 12px; }

  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label {
    width: 140px; text-align: right;
    font-size: 13.5px; font-weight: 700; color: #1e293b;
    flex-shrink: 0; line-height: 1.4;
  }
  .bar-label-sub { font-size: 11px; color: #94a3b8; font-weight: 500; }
  .bar-group {
    flex: 1; display: flex; flex-direction: column; gap: 4px;
  }
  .bar-track {
    height: 24px; background: #f1f5f9; border-radius: 4px;
    position: relative; overflow: hidden;
    display: flex; align-items: center;
  }
  .bar-fill {
    height: 100%; border-radius: 4px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px;
    font-size: 12.5px; font-weight: 800; color: #fff;
    min-width: 40px;
  }
  .bf-control { background: #cbd5e1; color: #475569; }
  .bf-experiment { background: #1e293b; }

  .bar-change {
    width: 80px; text-align: center; flex-shrink: 0;
    font-size: 15px; font-weight: 800; color: #10b981;
  }

  .divider { height: 1px; background: #f1f5f9; margin: 1px 0; }

  .note {
    text-align: center; font-size: 11px; color: #94a3b8;
    margin-top: 12px; line-height: 1.5; font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <div class="fig-title">代码规范性四维提升对比</div>
  <div class="fig-subtitle">对照组 (2024秋 N=62) vs 实验组 (2025秋 N=58)</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch ls-control"></div> 对照组 (2024秋)</div>
    <div class="legend-item"><div class="legend-swatch ls-experiment"></div> 实验组 (2025秋)</div>
  </div>

  <div class="bars-container">
    <div class="bar-row">
      <div class="bar-label">命名规范符合率</div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-control" style="width:54.2%">54.2%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-experiment" style="width:85.7%">85.7%</div>
        </div>
      </div>
      <div class="bar-change">+31.5pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">注释覆盖率<br><span class="bar-label-sub">（关键方法）</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-control" style="width:22.6%">22.6%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-experiment" style="width:61.3%">61.3%</div>
        </div>
      </div>
      <div class="bar-change">+38.7pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">分层架构合规率</div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-control" style="width:38.1%">38.1%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-experiment" style="width:79.3%">79.3%</div>
        </div>
      </div>
      <div class="bar-change">+41.2pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">MVC模式正确使用率</div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-control" style="width:41.9%">41.9%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-experiment" style="width:82.8%">82.8%</div>
        </div>
      </div>
      <div class="bar-change">+40.9pp</div>
    </div>
  </div>

  <div class="note">数据来源：AI四维审查系统 + 教师人工复核 | 统计方法：SPSS 26.0 独立样本t检验 | 所有差异 p&lt;0.001</div>
</div>
</body>
</html>
