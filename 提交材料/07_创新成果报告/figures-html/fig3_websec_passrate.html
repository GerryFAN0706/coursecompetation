<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    display: flex; justify-content: center;
    padding: 24px;
    color: #1e293b;
  }
  .container { width: 960px; }
  .fig-title {
    text-align: center; font-size: 18px; font-weight: 800;
    color: #1e293b; margin-bottom: 2px; letter-spacing: 0.5px;
  }
  .fig-subtitle {
    text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 12px;
  }

  .legend {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #64748b; font-weight: 600;
  }
  .legend-swatch { width: 24px; height: 10px; border-radius: 3px; }
  .ls-first { background: #93c5fd; }
  .ls-final { background: #1e293b; }

  .bars-container { display: flex; flex-direction: column; gap: 12px; }

  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label {
    width: 120px; text-align: right;
    font-size: 14px; font-weight: 700; color: #334155;
    flex-shrink: 0; line-height: 1.4;
  }
  .bar-label-sub { font-size: 12px; color: #94a3b8; font-weight: 400; }
  .bar-group { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .bar-track {
    height: 26px; background: #f1f5f9; border-radius: 4px;
    position: relative; overflow: hidden;
    display: flex; align-items: center;
  }
  .bar-fill {
    height: 100%; border-radius: 4px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px;
    font-size: 13px; font-weight: 800; color: #fff;
    min-width: 36px;
  }
  .bf-first { background: #93c5fd; color: #1e40af; }
  .bf-final { background: #1e293b; }

  .bar-change {
    width: 70px; text-align: center; flex-shrink: 0;
    font-size: 15px; font-weight: 800; color: #10b981;
  }

  .divider { height: 1px; background: #f1f5f9; margin: 1px 0; }

  .difficulty-bar {
    display: flex; align-items: center; justify-content: center;
    margin-top: 10px; gap: 6px;
  }
  .diff-segment {
    flex: 1; height: 6px; border-radius: 3px;
  }
  .diff-label { font-size: 12px; color: #94a3b8; flex-shrink: 0; font-weight: 600; }

  .callout {
    display: inline-block; margin-top: 10px;
    background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; color: #dc2626; font-weight: 700;
  }
  .callout-wrapper { text-align: center; }

  .note {
    text-align: center; font-size: 12px; color: #94a3b8;
    margin-top: 10px; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <div class="fig-title">WebSec安全攻防闯关平台通关率数据</div>
  <div class="fig-subtitle">N=58 | 5级递进关卡 | 难度逐级递增</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch ls-first"></div> 首次通过率</div>
    <div class="legend-item"><div class="legend-swatch ls-final"></div> 最终通过率（含教师干预后）</div>
  </div>

  <div class="bars-container">
    <div class="bar-row">
      <div class="bar-label">第1关<br><span class="bar-label-sub">SQL注入</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-first" style="width:72%">72%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-final" style="width:95%">95%</div>
        </div>
      </div>
      <div class="bar-change">+23pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">第2关<br><span class="bar-label-sub">越权访问</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-first" style="width:40%">40%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-final" style="width:82%">82%</div>
        </div>
      </div>
      <div class="bar-change">+42pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">第3关<br><span class="bar-label-sub">Session劫持</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-first" style="width:35%">35%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-final" style="width:78%">78%</div>
        </div>
      </div>
      <div class="bar-change">+43pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">第4关<br><span class="bar-label-sub">XSS</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-first" style="width:28%">28%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-final" style="width:71%">71%</div>
        </div>
      </div>
      <div class="bar-change">+43pp</div>
    </div>

    <div class="divider"></div>

    <div class="bar-row">
      <div class="bar-label">第5关<br><span class="bar-label-sub">综合</span></div>
      <div class="bar-group">
        <div class="bar-track">
          <div class="bar-fill bf-first" style="width:15%">15%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill bf-final" style="width:58%">58%</div>
        </div>
      </div>
      <div class="bar-change">+43pp</div>
    </div>
  </div>

  <div class="difficulty-bar">
    <div class="diff-label">易</div>
    <div class="diff-segment" style="background:#86efac"></div>
    <div class="diff-segment" style="background:#bef264"></div>
    <div class="diff-segment" style="background:#fde047"></div>
    <div class="diff-segment" style="background:#fbbf24"></div>
    <div class="diff-segment" style="background:#f87171"></div>
    <div class="diff-label">难</div>
  </div>

  <div class="callout-wrapper">
    <div class="callout">第2关越权访问：首次仅40%通过 &rarr; 教师干预后翻倍至82%，验证"实时大屏 + 即时干预"机制有效性</div>
  </div>

  <div class="note">数据来源：WebSec平台日志 | 2025秋学期 6次闯关活动累计</div>
</div>
</body>
</html>
