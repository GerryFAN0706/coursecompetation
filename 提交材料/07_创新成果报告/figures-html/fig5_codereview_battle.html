<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    display: flex; justify-content: center;
    padding: 24px;
    color: #1e293b;
  }
  .container { width: 960px; }
  .fig-title {
    text-align: center; font-size: 18px; font-weight: 800;
    color: #1e293b; margin-bottom: 2px; letter-spacing: 0.5px;
  }
  .fig-subtitle {
    text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 12px;
  }

  .legend {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 12px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #64748b; font-weight: 600;
  }
  .legend-swatch { width: 24px; height: 10px; border-radius: 3px; }
  .ls-student { background: #3b82f6; }
  .ls-ai { background: #8b5cf6; }

  .dims { display: flex; flex-direction: column; gap: 12px; }

  .dim-row { display: flex; align-items: center; gap: 10px; }
  .dim-label {
    width: 130px; text-align: right; flex-shrink: 0;
    font-size: 14px; font-weight: 700; color: #334155;
    line-height: 1.4;
  }
  .dim-label-sub { font-size: 12px; color: #94a3b8; font-weight: 400; }
  .dim-group { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .dim-track {
    height: 28px; background: #f1f5f9; border-radius: 4px;
    position: relative; overflow: hidden;
    display: flex; align-items: center;
  }
  .dim-fill {
    height: 100%; border-radius: 4px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 10px;
    font-size: 14px; font-weight: 800; color: #fff;
    min-width: 36px;
  }
  .df-student { background: #3b82f6; }
  .df-ai { background: #8b5cf6; }

  .dim-winner {
    width: 80px; text-align: center; flex-shrink: 0;
    font-size: 12px; font-weight: 700; color: #fff;
    padding: 3px 8px; border-radius: 10px;
  }
  .dw-student { background: #3b82f6; }
  .dw-ai { background: #8b5cf6; }
  .dw-draw { background: #94a3b8; }

  .divider { height: 1px; background: #f1f5f9; margin: 1px 0; }

  .conclusion {
    display: flex; align-items: center; justify-content: center;
    margin-top: 12px; padding: 8px 18px;
    background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 10px;
  }
  .conclusion-text {
    font-size: 15px; font-weight: 800; color: #dc2626; text-align: center;
  }
  .conclusion-sub {
    font-size: 13px; font-weight: 500; color: #64748b; margin-top: 3px;
  }

  .note {
    text-align: center; font-size: 12px; color: #94a3b8;
    margin-top: 10px; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <div class="fig-title">Code Review Battle 人机审查发现对比</div>
  <div class="fig-subtitle">N=10组 | 评分范围 0-5 | 学期累计8次对战</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch ls-student"></div> 学生团队</div>
    <div class="legend-item"><div class="legend-swatch ls-ai"></div> AI审查</div>
  </div>

  <div class="dims">
    <!-- 发现数量 -->
    <div class="dim-row">
      <div class="dim-label">发现数量<br><span class="dim-label-sub">越多越好</span></div>
      <div class="dim-group">
        <div class="dim-track">
          <div class="dim-fill df-student" style="width:60%">3</div>
        </div>
        <div class="dim-track">
          <div class="dim-fill df-ai" style="width:100%">5</div>
        </div>
      </div>
      <div class="dim-winner dw-ai">AI 胜出</div>
    </div>

    <div class="divider"></div>

    <!-- 关键漏洞命中 -->
    <div class="dim-row">
      <div class="dim-label">关键漏洞命中<br><span class="dim-label-sub">越多越好</span></div>
      <div class="dim-group">
        <div class="dim-track">
          <div class="dim-fill df-student" style="width:40%">2</div>
        </div>
        <div class="dim-track">
          <div class="dim-fill df-ai" style="width:60%">3</div>
        </div>
      </div>
      <div class="dim-winner dw-ai">AI 胜出</div>
    </div>

    <div class="divider"></div>

    <!-- 误报数 -->
    <div class="dim-row">
      <div class="dim-label">误报数<br><span class="dim-label-sub">越少越好</span></div>
      <div class="dim-group">
        <div class="dim-track">
          <div class="dim-fill df-student" style="width:4%">0</div>
        </div>
        <div class="dim-track">
          <div class="dim-fill df-ai" style="width:20%">1</div>
        </div>
      </div>
      <div class="dim-winner dw-student">学生 胜出</div>
    </div>

    <div class="divider"></div>

    <!-- 业务理解 -->
    <div class="dim-row">
      <div class="dim-label">业务理解<br><span class="dim-label-sub">越高越好</span></div>
      <div class="dim-group">
        <div class="dim-track">
          <div class="dim-fill df-student" style="width:80%">4</div>
        </div>
        <div class="dim-track">
          <div class="dim-fill df-ai" style="width:40%">2</div>
        </div>
      </div>
      <div class="dim-winner dw-student">学生 胜出</div>
    </div>
  </div>

  <div class="conclusion">
    <div>
      <div class="conclusion-text">人机协同 &gt; 单独任何一方</div>
      <div class="conclusion-sub">AI擅长数量与覆盖面，学生擅长业务理解与误报识别 &mdash; 互补组合效果最佳</div>
    </div>
  </div>

  <div class="note">数据来源：Code Review Battle对战日志 | 35%场次学生团队胜出 | 43%的AI误报被学生成功识别（从12%提升）</div>
</div>
</body>
</html>
